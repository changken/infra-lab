# Use postgres/example user/password credentials

services:

  db:
    image: postgres:19rc1-alpine
    # restart: always
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - ~/pgsql-data:/var/lib/postgresql
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    networks:
      - pgsql-net
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-RECREATED}
      POSTGRES_USER: ${DB_USERNAME:-RECREATED}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-RECREATED}
      #POSTGRES_INITDB_ARGS: --timezone='Asia/Taipei' #設定台北時區
      TZ: ${TZ:-Asia/Taipei} #台北
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer
    #restart: always
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - pgsql-net

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    ports:
      - 127.0.0.1:5050:80
    environment:
      # Required by pgAdmin
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret

      # Don't require the user to login
      PGADMIN_CONFIG_SERVER_MODE: 'False'

      # Don't require a "master" password after logging in
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    networks:
      - pgsql-net


networks:
  pgsql-net:
    driver: bridge
    #internal: true
    #external: true
