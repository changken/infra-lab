networks:
  forgejo:
    external: false

services:
  server:
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=${DB_NAME:-forgejo}
      - FORGEJO__database__USER=${DB_USERNAME:-forgejo}
      - FORGEJO__database__PASSWD=${DB_PASSWORD:-forgejo}
    restart: always
    networks:
      - forgejo
    volumes:
      - ./forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:22"
    depends_on:
      - db
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USERNAME:-forgejo}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-forgejo}
      - POSTGRES_DB=${DB_NAME:-forgejo}
    networks:
      - forgejo
    volumes:
      - ./postgres:/var/lib/postgresql

