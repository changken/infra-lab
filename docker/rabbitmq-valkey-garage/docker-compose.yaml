services:
  my-rabbit:
    image: rabbitmq:4-management
    container_name: my-rabbit
    environment: 
      - RABBITMQ_DEFAULT_USER=${MQ_USERNAME:-user}
      - RABBITMQ_DEFAULT_PASS=${MQ_PASSWORD:-password}
    ports: 
      - 15672:15672
      - 5672:5672

  my-valkey-server:
    image: valkey/valkey-bundle:latest
    container_name: my-valkey-server
    #environment:
    # - VALKEY_EXTRA_FLAGS='--save 60 1 --loglevel warning'
    ports:
      - 6379:6379
    volumes:
      - ./valkey:/root

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: garage
    restart: unless-stopped
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # 節點間 RPC
      - "3902:3902"   # 靜態網站託管
      - "3903:3903"   # Admin API / metrics
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:-"GKGKxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"} #"GK$(openssl rand -hex 16)   
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:-"xxxxxxxxxxxxxxxxxxxxxxxxxx"} #"請用 openssl rand -hex 32 產生" 
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET_NAME:-"default-bucket"} 
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - ./meta:/var/lib/garage/meta
      - ./data:/var/lib/garage/data
    command: ["/garage", "server", "--single-node", "--default-bucket"]

